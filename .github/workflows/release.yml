name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tangxiangxiang/nuvyn

jobs:
  release:
    name: Build and publish release image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main for ancestry verification
        run: git fetch --no-tags origin main

      - name: Verify release commit is on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TAG_SHA" origin/main

      - name: Resolve and validate SemVer release tag
        id: semver
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Fail on invalid release tag
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Tag $RELEASE_TAG is not a supported SemVer release tag (expected vMAJOR.MINOR.PATCH with an optional prerelease)." >&2
            exit 1
          fi

      - name: Resolve image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/tangxiangxiang/nuvyn
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.semver.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local release smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nuvyn-release-smoke:${{ github.sha }}
          cache-from: type=gha,scope=nuvyn-release
          cache-to: type=gha,mode=max,scope=nuvyn-release

      - name: Validate production Compose contract
        env:
          NUVYN_IMAGE: nuvyn-release-smoke:${{ github.sha }}
        run: docker compose -f compose.production.yml config --quiet

      - name: Run packaged authentication smoke
        env:
          DOCKER_IMAGE: nuvyn-release-smoke:${{ github.sha }}
          DOCKER_PORT: 18080
        run: npm run test:deployment-auth

      - name: Run Vault writer lifecycle smoke
        env:
          DOCKER_IMAGE: nuvyn-release-smoke:${{ github.sha }}
        run: npm run test:deployment-vault-lifecycle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture release image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nuvyn-release
          cache-to: type=gha,mode=max,scope=nuvyn-release
          provenance: true
          sbom: true

      - name: Write release summary
        if: success()
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          {
            echo "## Nuvyn Release"
            echo
            echo "Version: $RELEASE_VERSION"
            echo "Image: $IMAGE"
            echo "Digest: $DIGEST"
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Revision: $REVISION"
          } >> "$GITHUB_STEP_SUMMARY"
