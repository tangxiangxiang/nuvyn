name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Check legacy brand residue
        run: npm run lint:brand

      - name: Build
        run: npm run build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit suite
        run: npm run test:unit

  integration-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run History integration suite
        run: npm run test:history-integration

  integration-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Recovery integration suite
        run: npm run test:recovery-integration

  e2e-application:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e-application (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run application browser E2E shard
        run: node node_modules/@playwright/test/cli.js test --config=playwright.cross-platform.config.ts --shard=${{ matrix.shard }}/4 --reporter=line,github

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: application-e2e-evidence-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  draft-store-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Draft Store browser E2E
        run: npm run test:e2e:draft-store

      - name: Upload Draft Store failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: draft-store-e2e-evidence
          path: test-results
          if-no-files-found: ignore

  platform-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
    name: platform-compatibility (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run platform compatibility smoke
        run: npm run test:platform-smoke

  tags-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tags scale evidence
        run: npm run test:tags-scale

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify browser-facing Docker origin wiring
        shell: bash
        run: |
          set -euo pipefail
          default="$(docker compose config)"
          grep -F 'host_ip: 127.0.0.1' <<<"$default"
          grep -F 'published: "3000"' <<<"$default"
          grep -F 'target: 3000' <<<"$default"
          grep -F 'NUVYN_PUBLIC_ORIGIN: http://127.0.0.1:3000' <<<"$default"
          custom="$(NUVYN_PORT=43123 docker compose config)"
          grep -F 'NUVYN_PUBLIC_ORIGIN: http://127.0.0.1:43123' <<<"$custom"
          grep -F 'host_ip: 127.0.0.1' <<<"$custom"
          grep -F 'published: "43123"' <<<"$custom"
          grep -F 'target: 3000' <<<"$custom"
          widened="$(NUVYN_BIND_ADDRESS=0.0.0.0 NUVYN_PORT=43123 docker compose config)"
          grep -F 'host_ip: 0.0.0.0' <<<"$widened"
          grep -F 'published: "43123"' <<<"$widened"
          grep -F 'target: 3000' <<<"$widened"
          grep -F 'NUVYN_PUBLIC_ORIGIN: http://127.0.0.1:43123' <<<"$widened"
          explicit="$(NUVYN_PORT=43123 NUVYN_PUBLIC_ORIGIN=https://nuvyn.example.com docker compose config)"
          grep -F 'NUVYN_PUBLIC_ORIGIN: https://nuvyn.example.com' <<<"$explicit"

      - name: Verify Docker build context exclusions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'src/content/' .dockerignore
          grep -Fx 'backups/' .dockerignore
          grep -Fx 'data/' .dockerignore

      - name: Build production image
        run: docker build . -t nuvyn-ci-smoke

      - name: Run packaged authentication smoke
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_IMAGE=nuvyn-ci-smoke \
            DOCKER_PORT=18080 \
            npm run test:deployment-auth

      - name: Run Vault writer Docker lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_IMAGE=nuvyn-ci-smoke \
            npm run test:deployment-vault-lifecycle

  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run dedicated authentication browser smoke
        run: npm run test:e2e:auth

      - name: Upload authentication browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: auth-browser-evidence
          path: test-results
          if-no-files-found: ignore

  visual:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run macOS visual baselines
        run: node node_modules/@playwright/test/cli.js test e2e/markdown-visual.spec.ts --reporter=line,github
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence-macos
          path: test-results
          if-no-files-found: ignore
